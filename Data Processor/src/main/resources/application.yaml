# Spring infrastructure for the worker process itself.
spring:
  application:
    name: data-processor
  main:
    web-application-type: none
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=NoveoCareDB;encrypt=true;trustServerCertificate=true;}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:securePass123!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MINIMUM_IDLE:5}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
      # Log a warning when a connection is held longer than 10 seconds — helps detect leaks.
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD:10000}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:data-processor-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  kafka:
    topics:
      audit-trail: ${AUDIT_TRAIL_TOPIC:topic-audit-trail}
      anomaly-alerts: ${ANOMALY_ALERTS_TOPIC:topic-anomaly-alerts}
      dlq: ${AUDIT_TRAIL_DLQ_TOPIC:topic-audit-trail-dlq}
    consumer:
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:5}
      load-shedding-lag-threshold: ${KAFKA_LOAD_SHEDDING_LAG_THRESHOLD:10000}
  redis:
    ttl:
      session-buffer: 30m
      next-actions: 2h
      risk: 15m
      live-stats: 24h
      active-anomaly: 30m
      pending-alerts: 30m
      session-insight: 2h
      dashboard: 15m
      forecast: 24h
    pubsub:
      critical-alerts-channel: ${REDIS_CRITICAL_ALERTS_CHANNEL:CRITICAL_ALERT}
      system-traffic-anomaly-channel: ${REDIS_SYSTEM_TRAFFIC_ANOMALY_CHANNEL:SYSTEM_TRAFFIC_ANOMALY}
  rules:
    unusual-hour:
      start: 2
      end: 4
    skip-login:
      allowed-actions:
        - Connexion
        - Connexion SSO
        - Connexion en tant que
        - Activation de compte
    repeated-fail:
      types:
        - BANKING_ACTIONS
        - LOGGING_ACTIONS
      consecutive: 3
    rapid-fire:
      min-events: 3
      window-seconds: 2
    geo-jump:
      enabled: true
    session-timeout:
      threshold-seconds: 1200
    impossible-seq:
      min-probability: 0.005
    path-deviation:
      min-probability: 0.02
    session-end-actions:
      - "Déconnexion"
      - "Deconnexion"
      - "DÃ©connexion"
      - "SSO Disconnect"
  risk:
    medium-threshold: 0.05
    high-threshold: 0.20
    critical-threshold: 80.0
    high-risk-types:
      - geo_jump
      - skip_login
      - data_exfiltration
      - impossible_device_switch
  stats:
    live:
      events-window-seconds: 60
      actions-window-minutes: 15
      countries-window-minutes: 15
      anomaly-window-minutes: 60
      ko-window-minutes: 15
  scheduling:
    live-stats-fixed-rate-ms: 5000
    trend-cron: "0/30 * * * * *"

  ai:
    runtime-version: "v3.6.1"
    base-path: "classpath:/AI/"
    models-path: "models/"
    config-path: "config/"
    reports-path: "reports/"
    tabular-anomaly:
      enabled: true
      xgboost-enabled: true
      lightgbm-enabled: true
      catboost-enabled: true
      oneclasssvm-enabled: true
      fail-open: true
      timeout-ms: 150
    sequence:
      enabled: true
      strict-schema: true
      allow-legacy-fallback: false
      min-context-events: 3
      primary-model: transformer
      fast-model: tcn
      load-shedding-model: tcn
      run-both: false
    load-shedding:
      tcn-lag-threshold: 5000
      rules-only-lag-threshold: 20000
    risk-fusion:
      enabled: true
      renormalize-missing-model-weights: true
      xgboost-weight: 0.30
      lightgbm-weight: 0.25
      transformer-weight: 0.20
      tcn-weight: 0.10
      rules-weight: 0.15
      business-context-weight: 0.00
      medium-threshold: 35.0
      high-threshold: 60.0
      critical-threshold: 80.0
    persona:
      enabled: false
      skipped-reason: "Persona intentionally skipped in V3.6.1 dataprocessor refactor"
    churn:
      enabled: true
      preferred-model: "profile_only_ExtraTrees"
      high-threshold: 0.70
      medium-threshold: 0.30
    forecast:
      enabled: true
      anomaly-rate-preferred-model: "Ridge"
      total-events-preferred-model: "XGBoost"
      fallback-enabled: true
    llm-explanation:
      enabled: false
      generate-evidence-payload: true
      handled-by: "api-service"
      include-raw-evidence: true
      do-not-invent-evidence: true
    risk:
      ai-score-scale: 5.0
      medium-threshold: 35.0
      high-threshold: 60.0
      critical-threshold: 80.0
  features:
    download-window-seconds: 120
    rapid-action-seconds: 7
    session-alert-risk-threshold: 60.0
