# Spring infrastructure for the worker process itself.
spring:
  application:
    name: data-processor
  main:
    web-application-type: none
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=NoveoCareDB;encrypt=true;trustServerCertificate=true;}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:securePass123!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:data-processor-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  kafka:
    topics:
      audit-trail: ${AUDIT_TRAIL_TOPIC:topic-audit-trail}
      anomaly-alerts: ${ANOMALY_ALERTS_TOPIC:topic-anomaly-alerts}
      dlq: ${AUDIT_TRAIL_DLQ_TOPIC:topic-audit-trail-dlq}
    consumer:
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
      load-shedding-lag-threshold: ${KAFKA_LOAD_SHEDDING_LAG_THRESHOLD:10000}
  redis:
    ttl:
      session-buffer: 30m
      next-actions: 2h
      risk: 15m
      live-stats: 24h
      active-anomaly: 30m
      pending-alerts: 30m
      session-insight: 2h
      dashboard: 15m
      forecast: 24h
    pubsub:
      critical-alerts-channel: ${REDIS_CRITICAL_ALERTS_CHANNEL:CRITICAL_ALERT}
      system-traffic-anomaly-channel: ${REDIS_SYSTEM_TRAFFIC_ANOMALY_CHANNEL:SYSTEM_TRAFFIC_ANOMALY}
  rules:
    unusual-hour:
      start: 2
      end: 4
    skip-login:
      allowed-actions:
        - Connexion
        - Connexion SSO
        - Connexion en tant que
        - Activation de compte
    repeated-fail:
      types:
        - BANKING_ACTIONS
        - LOGGING_ACTIONS
      consecutive: 3
    rapid-fire:
      min-events: 3
      window-seconds: 2
    geo-jump:
      enabled: true
    session-timeout:
      threshold-seconds: 1200
    impossible-seq:
      min-probability: 0.005
    path-deviation:
      min-probability: 0.02
    session-end-actions:
      - "Déconnexion"
      - "Deconnexion"
      - "DÃ©connexion"
      - "SSO Disconnect"
  risk:
    medium-threshold: 0.05
    high-threshold: 0.20
    critical-threshold: 80.0
    high-risk-types:
      - geo_jump
      - skip_login
      - data_exfiltration
      - impossible_device_switch
  stats:
    live:
      events-window-seconds: 60
      actions-window-minutes: 15
      countries-window-minutes: 15
      anomaly-window-minutes: 60
      ko-window-minutes: 15
  scheduling:
    live-stats-fixed-rate-ms: 60000
    trend-cron: "0 */5 * * * *"
  trend:
    spike-sigma: 2.0
  ai:
    base-path: "classpath:/AI/"
    manifest: deployment_manifest.json
    feature-bundle: feature_bundle.json
  features:
    download-window-seconds: 120
    rapid-action-seconds: 7
    session-alert-risk-threshold: 60.0
