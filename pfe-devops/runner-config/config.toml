shutdown_timeout = 0

[session_server]
  session_timeout = 1800

[[runners]]
  name = "runner1"
  url = "http://gitlab"
  clone_url = "http://gitlab"
  id = 1
  token = "YOUR_EXISTING_TOKEN"
