spring:
  config:
    import: optional:file:.env[.properties]
  # Application identity reused in logs, metrics, and dashboards.
  application:
    name: ${SPRING_APPLICATION_NAME:api-service}


  # SQL Server connection for read-side analytics snapshots.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=NoveoCareDB;encrypt=true;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.microsoft.sqlserver.jdbc.SQLServerDriver}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
      # Log a warning when a connection is held longer than 10 seconds — helps detect leaks.
      leak-detection-threshold: ${SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD:10000}

  # JPA only reads existing tables; schema generation stays disabled.
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        connection:
          release_mode: after_transaction
        transaction:
          jta:
            platform: false

  # Schema migrations are owned by the Data Processor project.
  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:false}
    change-log: ${SPRING_LIQUIBASE_CHANGE_LOG:classpath:db/changelog/db.changelog-master.yaml}

  # SMTP settings used when email verification sending is enabled.
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:false}

  # Redis stores the freshest risk, anomaly, and stats snapshots.
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE:16}
          max-idle: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE:8}
          min-idle: ${SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE:2}
          max-wait: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_WAIT:5s}

  # Gemini is optional; the service falls back to local heuristics when the key is absent.
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-2.5-flash}

app:
  api:
    schema-version: ${APP_API_SCHEMA_VERSION:v3.6.1}
  llm:
    enabled: ${APP_LLM_ENABLED:true}
    provider: ${APP_LLM_PROVIDER:nvidia-nim}
    cache:
      redis-ttl-hours: ${APP_V36_EXPLANATIONS_CACHE_TTL_HOURS:24}
      generation-lock-ttl-seconds: ${APP_V36_EXPLANATIONS_LOCK_TTL_SECONDS:30}
    nvidia:
      base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
      api-key: ${NVIDIA_API_KEY:}
      model: ${NVIDIA_MODEL:nvidia/nemotron-3-super-120b-a12b}
      temperature: ${NVIDIA_TEMPERATURE:1.0}
      top-p: ${NVIDIA_TOP_P:0.95}
      max-tokens: ${NVIDIA_MAX_TOKENS:4096}
      enable-thinking: ${NVIDIA_ENABLE_THINKING:false}
      reasoning-budget: ${NVIDIA_REASONING_BUDGET:0}
      send-reasoning-budget-when-zero: ${NVIDIA_SEND_REASONING_BUDGET_WHEN_ZERO:false}
      timeout-ms: ${NVIDIA_TIMEOUT_MS:120000}
      include-extra-body: ${NVIDIA_INCLUDE_EXTRA_BODY:true}
      minimal-request-mode: ${NVIDIA_MINIMAL_REQUEST_MODE:false}
      log-request-json: ${NVIDIA_LOG_REQUEST_JSON:false}
      log-request-max-chars: ${NVIDIA_LOG_REQUEST_MAX_CHARS:4000}
  v36:
    redis:
      prefer-v36-keys: ${APP_V36_REDIS_PREFER_V36_KEYS:true}
      fallback-to-legacy: ${APP_V36_REDIS_FALLBACK_TO_LEGACY:true}
    explanations:
      cache-enabled: ${APP_V36_EXPLANATIONS_CACHE_ENABLED:true}
      cache-ttl-hours: ${APP_V36_EXPLANATIONS_CACHE_TTL_HOURS:24}
      max-evidence-size-kb: ${APP_V36_EXPLANATIONS_MAX_EVIDENCE_SIZE_KB:128}
      lock-ttl-seconds: ${APP_V36_EXPLANATIONS_LOCK_TTL_SECONDS:30}
      evidence-rehydrate-ttl-hours: ${APP_V36_EXPLANATIONS_EVIDENCE_REHYDRATE_TTL_HOURS:24}
      generate-on-get: ${APP_V36_EXPLANATIONS_GENERATE_ON_GET:false}
      default-style: ${APP_V36_EXPLANATIONS_DEFAULT_STYLE:security_analyst}
      default-language: ${APP_V36_EXPLANATIONS_DEFAULT_LANGUAGE:en}
    endpoints:
      expose-reports: ${APP_V36_ENDPOINTS_EXPOSE_REPORTS:true}
      expose-diagnostics: ${APP_V36_ENDPOINTS_EXPOSE_DIAGNOSTICS:true}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:9008}
  redis:
    pubsub:
      live-stats-channel: ${REDIS_LIVE_STATS_CHANNEL:LIVE_STATS}
  # Local topic names consumed by the stream bridge.
  kafka:
    topics:
      anomaly-alerts: ${APP_KAFKA_TOPIC_ANOMALY_ALERTS:topic-anomaly-alerts}
  auth:
    allowed-domain: ${APP_AUTH_ALLOWED_DOMAIN:@enicar.ucar.tn}
    verification:
      code-ttl-seconds: ${APP_AUTH_VERIFICATION_CODE_TTL_SECONDS:300}
      resend-cooldown-seconds: ${APP_AUTH_VERIFICATION_RESEND_COOLDOWN_SECONDS:120}
      max-attempts: ${APP_AUTH_VERIFICATION_MAX_ATTEMPTS:5}
      mail-enabled: ${APP_AUTH_VERIFICATION_MAIL_ENABLED:false}
      from: ${APP_AUTH_VERIFICATION_FROM:${SPRING_MAIL_USERNAME:}}
      logo-url: ${APP_AUTH_VERIFICATION_LOGO_URL:}
    password-reset:
      token-ttl-seconds: ${APP_AUTH_PASSWORD_RESET_TOKEN_TTL_SECONDS:600}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

server:
  # HTTP port exposed by this analytics API.
  port: ${SERVER_PORT:8081}

logging:
  # Destination used by logback-spring for structured Logstash output.
  logstash:
    destination: ${LOGSTASH_DESTINATION:localhost:5000}

management:
  # Expose actuator endpoints and Prometheus metrics for local observability.
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true




