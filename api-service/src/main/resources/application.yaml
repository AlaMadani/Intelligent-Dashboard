spring:
  # Application identity reused in logs, metrics, and dashboards.
  application:
    name: ${SPRING_APPLICATION_NAME:api-service}

  # SQL Server connection for read-side analytics snapshots.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=NoveoCareDB;encrypt=true;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:app_user}
    password: ${SPRING_DATASOURCE_PASSWORD:securePass123!}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.microsoft.sqlserver.jdbc.SQLServerDriver}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}

  # JPA only reads existing tables; schema generation stays disabled.
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  # Liquibase can be enabled later if this service starts owning schema migrations.
  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:false}
    change-log: ${SPRING_LIQUIBASE_CHANGE_LOG:classpath:db/changelog/db.changelog-master.yaml}

  # Redis stores the freshest risk, anomaly, and stats snapshots.
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE:16}
          max-idle: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE:8}
          min-idle: ${SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE:2}
          max-wait: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_WAIT:5s}

  # Gemini is optional; the service falls back to local heuristics when the key is absent.
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-2.5-flash}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:9000,http://localhost:9008 }
  # Local topic names consumed by the stream bridge.
  kafka:
    topics:
      anomaly-alerts: ${APP_KAFKA_TOPIC_ANOMALY_ALERTS:topic-anomaly-alerts}

server:
  # HTTP port exposed by this analytics API.
  port: ${SERVER_PORT:8081}

logging:
  # Destination used by logback-spring for structured Logstash output.
  logstash:
    destination: ${LOGSTASH_DESTINATION:localhost:5000}

management:
  # Expose actuator endpoints and Prometheus metrics for local observability.
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
