<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
{{styles}}
  </style>
</head>
<body>
  <table role="presentation" class="page" width="100%" cellspacing="0" cellpadding="0">
    <tr>
      <td align="center">
        <table role="presentation" class="card" width="100%" cellspacing="0" cellpadding="0">
          <tr>
            <td class="header">
              <div class="brand-wrap">{{brandBlock}}</div>
              <div class="title">{{title}}</div>
              <div class="intro">{{intro}}</div>
            </td>
          </tr>
          <tr>
            <td class="content">
              <p>Hi <strong>{{safeName}}</strong>,</p>
              <p class="copy">Enter this 6-digit code in the verification screen:</p>
              <table role="presentation" class="code-table" width="100%" cellspacing="0" cellpadding="0">
                <tr>
                  <td align="center" class="code-cell">
                    <div class="code">{{code}}</div>
                  </td>
                </tr>
              </table>
              <div class="note">{{note}}</div>
            </td>
          </tr>
          <tr>
            <td class="footer">
              If you did not request this action, you can safely ignore this email.
              <br><br>
              <span>NoveoCare</span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
